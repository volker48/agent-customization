image: node:22-bookworm-slim

stages:
  - verify

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

variables:
  PNPM_HOME: "$CI_PROJECT_DIR/.pnpm-home"
  PNPM_STORE_DIR: "$CI_PROJECT_DIR/.pnpm-store"

cache:
  key:
    files:
      - pnpm-lock.yaml
  paths:
    - .pnpm-store/

.default_node_job:
  stage: verify
  interruptible: true
  before_script:
    - corepack enable
    - corepack prepare pnpm@11.9.0 --activate
    - pnpm config set store-dir "$PNPM_STORE_DIR"
    - pnpm install --frozen-lockfile --ignore-scripts

lint:
  extends: .default_node_job
  script:
    - pnpm run lint

format:
  extends: .default_node_job
  script:
    - pnpm run format:check

typecheck:
  extends: .default_node_job
  script:
    - pnpm run typecheck

test:
  extends: .default_node_job
  script:
    - pnpm run test

rust:
  image: rust:1.85.1-bookworm@sha256:bf7d87666c4da6eace19e06d21bc4859c6e2a5c97a21ac273b0e082112753cf0
  stage: verify
  interruptible: true
  cache:
    key:
      files:
        - Cargo.lock
    paths:
      - .cargo/registry/
      - .cargo/git/
      - target/
  variables:
    CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  script:
    - rustup component add rustfmt clippy
    - cargo fmt --all --check
    - cargo clippy --all-targets --all-features -- -D warnings
    - cargo test --all
    - cargo build --release
