name: PiRemoteClient

options:
  deploymentTarget:
    iOS: "17.5"
  minimumXcodeGenVersion: "2.45.0"
  createIntermediateGroups: true
  defaultConfig: Debug

packages:
  PiRemoteClientPackage:
    path: .

targets:
  PiRemoteClientApp:
    type: application
    platform: iOS
    deploymentTarget: "17.5"
    sources:
      - path: App
    dependencies:
      - package: PiRemoteClientPackage
        product: PiRemoteClient
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: works.earendil.pi-remote-client
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Pi Remote
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSCameraUsageDescription: Scan the pairing QR code shown by Pi.
        UIApplicationSupportsIndirectInputEvents: true
