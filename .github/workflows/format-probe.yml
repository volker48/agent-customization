name: Format Probe

on:
  push:
    branches:
      - feat/pi-lav-run-orchestration

permissions:
  contents: read

jobs:
  format-probe:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Configure pnpm security
        run: |
          pnpm config set minimumReleaseAge 1440
          pnpm config set --json minimumReleaseAgeExclude '[
            "@earendil-works/pi-agent-core@0.84.2",
            "@earendil-works/pi-ai@0.84.2",
            "@earendil-works/pi-client@0.84.2",
            "@earendil-works/pi-coding-agent@0.84.2",
            "@earendil-works/pi-protocol@0.84.2",
            "@earendil-works/pi-telemetry@0.84.2",
            "@earendil-works/pi-tui@0.84.2"
          ]'
          pnpm config set ignore-scripts true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Show exact Oxfmt diff
        run: |
          cp pi-extensions/llm-verifier/core/cache.ts /tmp/cache.ts.before
          pnpm exec oxfmt pi-extensions/llm-verifier/core/cache.ts
          diff -u /tmp/cache.ts.before pi-extensions/llm-verifier/core/cache.ts || true
