name: PR Checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  node-unit:
    name: Node lint, format, typecheck, and unit tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Configure pnpm security
        run: |
          pnpm config set minimumReleaseAge 1440
          pnpm config set ignore-scripts true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test:unit

  swift-remote-control:
    name: Swift format and remote control unit tests
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Check Swift formatting
        working-directory: ios-remote-client
        run: |
          swift format lint --strict --recursive \
            --configuration '{"rules":{"NoAccessLevelOnExtensionDeclaration":false}}' \
            Sources Tests Package.swift

      - name: Run Swift unit tests
        working-directory: ios-remote-client
        run: swift run pi-remote-client-tests
