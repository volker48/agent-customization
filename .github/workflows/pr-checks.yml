name: Headlong Repair

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    name: Apply, format, and verify Headlong repair
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repair branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: feat/headlong-persistent-agent
          persist-credentials: true

      - name: Install pnpm
        uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Configure pnpm security
        run: |
          pnpm config set minimumReleaseAge 1440
          pnpm config set --json minimumReleaseAgeExclude '[
            "@earendil-works/pi-agent-core@0.84.2",
            "@earendil-works/pi-ai@0.84.2",
            "@earendil-works/pi-client@0.84.2",
            "@earendil-works/pi-coding-agent@0.84.2",
            "@earendil-works/pi-protocol@0.84.2",
            "@earendil-works/pi-telemetry@0.84.2",
            "@earendil-works/pi-tui@0.84.2"
          ]'
          pnpm config set ignore-scripts true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply repair payload
        run: |
          cat .github/headlong-repair.part* > /tmp/headlong-repair.b64
          base64 --decode /tmp/headlong-repair.b64 > /tmp/headlong-repair.tar.gz
          echo "849d4ed387a1cdd13c8e9876986928a2d28b528f1fb3cd89bbfed92225ceab07  /tmp/headlong-repair.tar.gz" | sha256sum --check -
          tar -xzf /tmp/headlong-repair.tar.gz
          rm .github/headlong-repair.part*
          pnpm exec oxfmt --write pi-extensions/headlong tests/headlong-*.test.ts

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test:unit

      - name: Commit verified repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(headlong): address ownership and security review"
          git push origin HEAD:feat/headlong-persistent-agent
