name: PR Checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  node-unit:
    name: Node lint, format, typecheck, and unit tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Configure pnpm security
        run: |
          pnpm config set minimumReleaseAge 1440
          pnpm config set --json minimumReleaseAgeExclude '[
            "@earendil-works/pi-agent-core@0.84.2",
            "@earendil-works/pi-ai@0.84.2",
            "@earendil-works/pi-client@0.84.2",
            "@earendil-works/pi-coding-agent@0.84.2",
            "@earendil-works/pi-protocol@0.84.2",
            "@earendil-works/pi-telemetry@0.84.2",
            "@earendil-works/pi-tui@0.84.2"
          ]'
          pnpm config set ignore-scripts true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (including custom type restrictions)
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test:unit

  trajectory-analyzer:
    name: Trajectory analyzer Python tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Run trajectory analyzer tests
        run: >-
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover
          -s hermes-plugins/trajectory_analyzer/tests -p 'test_*.py' -v

  swift-remote-control:
    name: Swift checks and iOS simulator build
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Check Swift formatting and run unit tests
        working-directory: ios-remote-client
        run: ./scripts/test.sh

      - name: Build iOS Simulator app
        working-directory: ios-remote-client
        run: ./scripts/build-simulator.sh
